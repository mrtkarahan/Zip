<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f2a44">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Patika">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Patika</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main>
  <header>
    <h1>Patika</h1>
    <div class="timer" id="timer">0:00</div>
  </header>
  <div class="row" id="sizes">
    <button data-size="5">Kolay</button><button data-size="6">Orta</button><button data-size="7">Zor</button>
  </div>
  <div class="row" id="modes">
    <button data-mode="random">Serbest</button><button data-mode="daily">Günlük</button>
  </div>
  <div id="board-wrap"><svg id="board" xmlns="http://www.w3.org/2000/svg"></svg></div>
  <div class="msg" id="msg"></div>
  <div class="row actions">
    <button id="undo">Geri al</button><button id="clear">Temizle</button>
    <button id="hint">İpucu</button><button id="new">Yeni bulmaca</button>
  </div>
</main>
<div id="win" hidden>
  <div class="card">
    <h2>Tebrikler!</h2>
    <p id="win-time"></p><p id="win-best"></p>
    <button id="win-new">Yeni bulmaca</button><button id="win-close">Kapat</button>
  </div>
</div>
<script src="js/generator.js"></script>
<script src="js/game.js"></script>
<script>if ('serviceWorker' in navigator && location.protocol.startsWith('http')) navigator.serviceWorker.register('sw.js');</script>
</body>
</html>
